<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子运势仪</title>
    <style>
        :root {
            --primary-red: #EB5757;
            --space-blue: #1A1A2F;
            --gold-yellow: #FFD700;
            --deep-space: #0A0A16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--deep-space);
            color: white;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* 宇宙粒子系统 */
        .universe-particles {
            position: fixed;
            width: 100vw;
            height: 80vh;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary-red);
            animation: particle-flow 20s linear infinite;
            filter: drop-shadow(0 0 8px #EB5757);
        }

        @keyframes particle-flow {
            0% { transform: rotate(0deg) translateX(30vw) scale(1); }
            50% { transform: rotate(180deg) translateX(30vw) scale(1.5); }
            100% { transform: rotate(360deg) translateX(30vw) scale(1); }
        }

        /* 主显示区域 */
        .result-container {
            height: 80vh;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }

        #luck-value {
            font-size: 38vw;
            font-family: 'Arial Black', sans-serif;
            color: var(--primary-red);
            text-shadow: 0 0 30px rgba(235,87,87,0.4);
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 2;
            position: relative;
        }

        /* 输入表单 */
        .bauhaus-form {
            height: 20vh;
            max-width: 800px;
            margin: 0 auto;
            padding: 2vh 2vw;
            display: grid;
            gap: 1.5rem;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .geometric-input {
            border: 3px solid #2F2F3A;
            padding: 1rem 2rem;
            background: transparent;
            color: white;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            transition: all 0.3s ease;
        }

        .geometric-input:focus {
            outline: none;
            border-color: var(--gold-yellow);
        }

        .bauhaus-btn {
            background: var(--primary-red);
            color: white;
            padding: 1.2rem 3rem;
            border: none;
            clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .bauhaus-btn:hover {
            transform: scale(1.05);
            background: #FF4747;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }
            
            #luck-value {
                font-size: 50vw;
            }
        }
    </style>
</head>
<body>
    <form id="astroForm" class="bauhaus-form">
        <div class="input-group">
            <input type="date" id="birthday" required class="geometric-input">
            <select id="bloodType" class="geometric-input">
                <option value="A">A型</option>
                <option value="B">B型</option>
                <option value="O">O型</option>
                <option value="AB">AB型</option>
            </select>
            <select id="mbti" class="geometric-input">
                <option value="INTJ">INTJ</option>
                <option value="INTP">INTP</option>
                <option value="ENTJ">ENTJ</option>
                <option value="ENTP">ENTP</option>
                <!-- 其他MBTI类型 -->
            </select>
        </div>
        <button type="submit" class="bauhaus-btn">启动量子计算</button>
    </form>

    <div class="result-container">
        <div id="luck-value">88</div>
        <div class="universe-particles" id="particleContainer"></div>
    </div>

    <script>
        // 生成宇宙粒子
        function createParticles() {
            const container = document.getElementById('particleContainer');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 20}s`;
                container.appendChild(particle);
            }
        }

        // 数值动画
        function animateValue(finalValue) {
            const element = document.getElementById('luck-value');
            element.style.transform = 'scale(1.2)';
            element.style.opacity = '0.5';
            
            setTimeout(() => {
                element.textContent = finalValue;
                element.style.transform = 'scale(1)';
                element.style.opacity = '1';
            }, 800);
        }

        // 模拟量子计算
        function quantumCalculation(data) {
            // 使用混沌算法生成随机数
            const noise = Array.from({length: 1000}, 
                () => Math.random()).reduce((a,b) => a^b, Date.now());
            
            // 傅里叶变换模拟
            return Math.abs(Math.sin(noise) * 100).toFixed(0);
        }

        // 表单提交
        document.getElementById('astroForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const formData = {
                birthday: document.getElementById('birthday').value,
                bloodType: document.getElementById('bloodType').value,
                mbti: document.getElementById('mbti').value,
                timestamp: Date.now()
            };

            // 显示加载状态
            document.getElementById('luck-value').style.color = '#2F2F3A';
            
            setTimeout(() => {
                const result = quantumCalculation(formData);
                document.getElementById('luck-value').style.color = '#EB5757';
                animateValue(result);
            }, 800);
        });

        // 初始化粒子系统
        createParticles();
    </script>
</body>
</html>
